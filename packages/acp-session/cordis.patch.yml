# One-by-one install of @lumine/dsh-acp-session. Same seam as the root
# lumine-dsh bundle: disable the default loop, insert this factory.

- id: agent-loop
  disabled: true

- insert:
    - id: lumine-acp-session
      name: '@lumine/dsh-acp-session'
      config:
        permission: yolo
        defaultProvider: claude
