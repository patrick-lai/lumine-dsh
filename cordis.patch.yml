# Lumine ACP bundle. Later layers win by id; ctx.agents.setFactory() is a unary slot.

# Replace the default DeepSeek agent-loop so an official ACP product owns the session.
- id: agent-loop
  disabled: true

# Stock dsh-base mounts goal-round-driver on the HOST plane. Disabling it only
# in a grok-build agent.cordis.yml does not unmount that host row — dump-config
# still listed it and the driver looped ACP rounds. Same seam as agent-loop:
# later layers win by id. Disabled = absent from the mounted set so lumine
# ACP harvest owns continue on this bundle.
- id: goal-round-driver
  disabled: true

- insert:
    - id: lumine-acp-session
      name: '@lumine/dsh-acp-session'
      config:
        permission: yolo
        defaultProvider: claude
    # Deferred DSH completion policy. tools/execute around-hook certifies
    # worker update_goal complete, then the original execute commits.
    # ACP marker harvest mounts INSTEAD OF goal-round-driver on lumine ACP
    # presets (those compositions disable the driver). Human /goal and RPC
    # goal.complete stay operator-authoritative.
    - id: lumine-goal-completion
      name: '@lumine/dsh-goal-completion'
      config:
        timeoutMs: 900000
        failClosed: true

# Pin the in-page browse directory picker. directory-picker-auto picks native on
# darwin; a detached `dsh` never shows the macOS dialog, so "+ Add workspace"
# appears to do nothing. Same-id name rewrite is not the seam — disable+insert.
- id: directory-picker
  name: '@deepseek-ai/dsh-host-directory-picker-auto'
  disabled: true

- insert:
    - id: directory-picker-browse
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: ui-directory-picker-browse
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'

# Do not disable llm-deepseek. Empty apiKeyEnv already skips the key gate;
# disabling the adapter left session.models.current on deepseek-official with
# nothing serving it (groups empty, prompt refused). Keep the official adapter
# mounted. This plugin's catalog adapter serves grok/claude/codex/cursor so
# grok-build current is grok-4.6 and routable.
#
# Profile `cordis.patch.yml` must not re-insert directory-picker-browse — this
# bundle already does. A second insert is a duplicate loader id.
